# Two services from one image. This file fixes the vault with NULL_VAULT_PATH;
# for choosing it in the browser instead, use compose.setup.yaml.
services:
  nullapi:
    build: .
    restart: unless-stopped
    ports:
      # keep it loopback; TLS terminates in the reverse proxy (or a
      # tailnet-only bind if that's the whole deployment). Host port is
      # configurable — 8080 is a common default other services may hold.
      - "127.0.0.1:${NULL_HOST_PORT:-8080}:8080"
    environment:
      NULL_VAULT_PATH: /vault
      NULL_TOKEN: ${NULL_TOKEN:?set NULL_TOKEN in .env}
      # Gates the browser UI, Al-Mina and /setup. Empty means "same as
      # NULL_TOKEN" — fine if only you hold it; SET IT SEPARATELY if any
      # program or model uses the API, or that program can approve its own
      # tier proposals.
      NULL_UI_TOKEN: ${NULL_UI_TOKEN:-}
      NULL_ADDR: ":8080"
      # NULL_MAX_BODY_BYTES: "200000"
      # How old a dakhil note must be, with no outstanding proposal,
      # before Al-Mina surfaces it as a staleness sweep. Default 14.
      # NULL_MINA_STALE_DAYS: "14"
    volumes:
      # Read-write on purpose: the renderer commits Al-Mina decisions and
      # first-open promotions (one commit per note). The vault must be a
      # git repository for those to work; reading works regardless.
      - ${VAULT_PATH:?set VAULT_PATH in .env}:/vault
    read_only: true
    # Must be able to write the vault (git commits). Default matches the image's
    # user; set NULL_UID/NULL_GID to your own ids if the vault is owned by you.
    user: "${NULL_UID:-10001}:${NULL_GID:-10001}"

  # MCP over Streamable HTTP, for a remote client (e.g. Claude.ai's
  # connector settings) that can't spawn nullmcp locally over stdio.
  # Optional: comment this whole service out if you only use stdio/SSH.
  nullmcp:
    build: .
    entrypoint: ["nullmcp"]
    restart: unless-stopped
    ports:
      # loopback only; a reverse proxy makes it reachable and terminates TLS.
      - "127.0.0.1:${NULL_MCP_HOST_PORT:-8092}:8092"
    environment:
      NULL_VAULT_PATH: /vault
      NULL_MCP_HTTP_ADDR: ":8092"
      NULL_TOKEN: ${NULL_MCP_TOKEN:?set NULL_MCP_TOKEN in .env}
      # Its own token, distinct from nullapi's — two independently
      # revocable credentials. Also the one OAuth's /authorize form checks.
      NULL_MCP_PUBLIC_URL: ${NULL_MCP_PUBLIC_URL:?set NULL_MCP_PUBLIC_URL in .env, e.g. https://host:10000}
      # Attributed in git log to a fixed, clearly-non-human identity.
      # NULL_GIT_NAME: "nullmcp"
      # NULL_GIT_EMAIL: "nullmcp@localhost"
    volumes:
      # Same host path as nullapi's, deliberately — one vault, two
      # presentations, both write (different things, each a commit).
      - ${VAULT_PATH:?set VAULT_PATH in .env}:/vault
    read_only: true
    # Must be able to write the vault (git commits). Default matches the image's
    # user; set NULL_UID/NULL_GID to your own ids if the vault is owned by you.
    user: "${NULL_UID:-10001}:${NULL_GID:-10001}"
