services:
  nullapi:
    build: .
    restart: unless-stopped
    ports:
      # keep it loopback; TLS terminates in the reverse proxy (or a
      # tailnet-only bind if that's the whole deployment). Host port is
      # configurable — 8080 is a common default other services on a
      # shared box may already hold.
      - "127.0.0.1:${NULL_HOST_PORT:-8080}:8080"
    environment:
      NULL_VAULT_PATH: /vault
      NULL_TOKEN: ${NULL_TOKEN:?set NULL_TOKEN in .env}
      NULL_ADDR: ":8080"
      # NULL_MAX_BODY_BYTES: "200000"
      # How old a dakhil note must be, with no outstanding proposal,
      # before GET /mina surfaces it as a staleness sweep. Default 14.
      # NULL_MINA_STALE_DAYS: "14"
    volumes:
      # read-only mount is deliberate — verify with: mount | grep vault
      - ${VAULT_PATH:?set VAULT_PATH in .env}:/vault:ro
    read_only: true

  # MCP over Streamable HTTP, for a remote client (e.g. Claude.ai's
  # connector settings) that can't spawn nullmcp locally over stdio.
  # Optional: comment this whole service out, or just never set
  # NULL_MCP_TOKEN in .env, if you only ever use nullmcp over stdio/SSH.
  nullmcp:
    build: .
    entrypoint: ["nullmcp"]
    restart: unless-stopped
    ports:
      # loopback only, same reasoning as nullapi above — a reverse proxy
      # (Tailscale Funnel, in this repo's own deployment) is what makes
      # it reachable from anywhere else, and terminates TLS.
      - "127.0.0.1:${NULL_MCP_HOST_PORT:-8092}:8092"
    environment:
      NULL_VAULT_PATH: /vault
      NULL_MCP_HTTP_ADDR: ":8092"
      NULL_TOKEN: ${NULL_MCP_TOKEN:?set NULL_MCP_TOKEN in .env}
      # Deliberately its own token, distinct from nullapi's NULL_TOKEN —
      # two services, two independently revocable credentials. Also the
      # one credential OAuth's /authorize form checks — see
      # spec/null-mcp-v0.md's OAuth section.
      NULL_MCP_PUBLIC_URL: ${NULL_MCP_PUBLIC_URL:?set NULL_MCP_PUBLIC_URL in .env, e.g. https://host:10000}
      # Attributed to a fixed, clearly-non-human identity in git log —
      # see internal/vault/write.go's gitIdentityEnv.
      # NULL_MCP_GIT_NAME: "nullmcp"
      # NULL_MCP_GIT_EMAIL: "nullmcp@localhost"
    volumes:
      # Same host path as nullapi's mount above, deliberately — one
      # vault, two presentations. NOT :ro here: create_note/write_note/
      # delete_note write directly to this mount and commit each change
      # (CLAUDE.md non-negotiable #2). This is the one write-capable
      # mount anywhere in this deployment.
      - ${VAULT_PATH:?set VAULT_PATH in .env}:/vault
    read_only: true
