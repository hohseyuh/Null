<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>null-mcp inspector</title>
<style>
  body { background:#14161a; color:#c9cdd3; font:15px/1.55 ui-monospace, "JetBrains Mono", monospace;
         max-width: 72ch; margin: 2rem auto; padding: 0 1rem 4rem; }
  h1 { font-size: 1.15rem; color:#e4e7ec; margin-bottom: 0.2rem; }
  h2 { font-size: 0.95rem; color:#e4e7ec; margin-top: 2rem; }
  .sub { color:#8a919c; font-size:0.85rem; margin-top:0; }
  select, textarea, button { font: inherit; background:#1c1f25; color:#c9cdd3;
    border:1px solid #2a2e36; border-radius:4px; padding:0.45rem; }
  select { width: 100%; }
  textarea { width:100%; height:6rem; margin-top:0.4rem; }
  button { cursor:pointer; margin-top:0.7rem; }
  button:hover { border-color:#4a6191; }
  label { display:block; margin-top:1rem; font-size:0.85rem; color:#8a919c; }
  pre { background:#1c1f25; border:1px solid #2a2e36; border-radius:6px;
        padding:0.8rem 1rem; overflow-x:auto; white-space:pre-wrap; word-break:break-word; }
  .err { color:#b3616a; }
  .tool { margin-bottom:1.2rem; padding-bottom:1rem; border-bottom:1px solid #2a2e36; }
  .tool strong { color:#7aa2f7; }
</style>
</head>
<body>
<h1>null-mcp inspector</h1>
<p class="sub">Dev-only. Every call here goes through a real MCP session, not a shortcut around one.</p>

<form method="post" action="/">
  <label>tool
    <select name="tool" required>
      <option value="" disabled {{if not .Selected}}selected{{end}}>choose a tool…</option>
      {{range .Tools}}<option value="{{.Name}}" {{if eq .Name $.Selected}}selected{{end}}>{{.Name}}</option>{{end}}
    </select>
  </label>
  <label>arguments (JSON)
    <textarea name="args" spellcheck="false">{{.Args}}</textarea>
  </label>
  <button type="submit">call</button>
</form>

{{if .Err}}<p class="err">{{.Err}}</p>{{end}}
{{if .Result}}
<h2>{{if .IsError}}error result{{else}}result{{end}}</h2>
<pre>{{.Result}}</pre>
{{end}}

<h2>available tools</h2>
{{range .Tools}}
<div class="tool">
  <strong>{{.Name}}</strong>
  <p class="sub">{{.Description}}</p>
</div>
{{end}}
</body>
</html>
