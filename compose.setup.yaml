# Choose the vault in the browser instead of fixing it in the environment.
#
#   echo "NULL_TOKEN=$(openssl rand -hex 32)"    >  .env
#   echo "NULL_UI_TOKEN=$(openssl rand -hex 32)" >> .env
#   echo "VAULTS_DIR=/srv/vaults"                >> .env   # parent of your vault(s)
#   docker compose -f compose.setup.yaml up -d --build nullapi
#   # open http://127.0.0.1:8080/login?token=<NULL_UI_TOKEN>, then /setup
#
# /setup can only browse inside VAULTS_DIR (mounted at /vaults). The choice
# is saved in the null-config volume. nullmcp reads the same file at boot, so
# start it (add NULL_MCP_TOKEN and NULL_MCP_PUBLIC_URL to .env) after you have
# chosen: `docker compose -f compose.setup.yaml --profile mcp up -d nullmcp`.
services:
  nullapi:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:${NULL_HOST_PORT:-8080}:8080"
    environment:
      NULL_TOKEN: ${NULL_TOKEN:?set NULL_TOKEN in .env}
      NULL_UI_TOKEN: ${NULL_UI_TOKEN:-}
      NULL_ADDR: ":8080"
    volumes:
      - ${VAULTS_DIR:?set VAULTS_DIR in .env}:/vaults
      - null-config:/config
    read_only: true
    # Must be able to write the vault (git commits). Default matches the image's
    # user; set NULL_UID/NULL_GID to your own ids if the vault is owned by you.
    user: "${NULL_UID:-10001}:${NULL_GID:-10001}"

  nullmcp:
    build: .
    entrypoint: ["nullmcp"]
    restart: unless-stopped
    profiles: ["mcp"]
    ports:
      - "127.0.0.1:${NULL_MCP_HOST_PORT:-8092}:8092"
    environment:
      NULL_MCP_HTTP_ADDR: ":8092"
      NULL_TOKEN: ${NULL_MCP_TOKEN:?set NULL_MCP_TOKEN in .env}
      NULL_MCP_PUBLIC_URL: ${NULL_MCP_PUBLIC_URL:?set NULL_MCP_PUBLIC_URL in .env}
    volumes:
      - ${VAULTS_DIR:?set VAULTS_DIR in .env}:/vaults
      - null-config:/config:ro
    read_only: true
    # Must be able to write the vault (git commits). Default matches the image's
    # user; set NULL_UID/NULL_GID to your own ids if the vault is owned by you.
    user: "${NULL_UID:-10001}:${NULL_GID:-10001}"

volumes:
  null-config:
